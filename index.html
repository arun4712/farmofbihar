<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Farm of Bihar</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="navbar">
      <h1>Farm of Bihar</h1>
      <nav>
        <a href="#">Home</a>
        <a href="#">Products</a>
        <a href="#">Contact</a>
        <div class="cart-icon" onclick="toggleCartDropdown()">
          🛒 Cart (<span id="cart-count">0</span>)
          <div class="cart-dropdown" id="cart-dropdown">
            <ul id="cart-list"></ul>
            <div class="cart-total" id="cart-total">Total: ₹0</div>
            <button id="checkout-btn" onclick="showCheckoutModal()">Place Order</button>
          </div>
        </div>
      </nav>
    </div>
  </header>

  <main>
    <div class="products">
      <div class="product">
        <h3>Basmati Rice</h3>
        <p>₹90/kg</p>
        <button class="add-to-cart" data-product="Basmati Rice" data-price="90">Add to Cart</button>
      </div>
      <div class="product">
        <h3>Sharbati Wheat</h3>
        <p>₹45/kg</p>
        <button class="add-to-cart" data-product="Sharbati Wheat" data-price="45">Add to Cart</button>
      </div>
      <div class="product">
        <h3>Mustard Oil</h3>
        <p>₹180/litre</p>
        <button class="add-to-cart" data-product="Mustard Oil" data-price="180">Add to Cart</button>
      </div>
    </div>
  </main>

  <!-- Modal for Checkout Form -->
  <div id="checkout-modal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <h2>Enter Your Details</h2>
      <form id="checkout-form" onsubmit="submitOrder(event)">
        <label for="name">Full Name:</label><br>
        <input type="text" id="name" name="name" required><br><br>

        <label for="address">Address:</label><br>
        <textarea id="address" name="address" required></textarea><br><br>

        <label for="phone">Phone Number:</label><br>
        <input type="tel" id="phone" name="phone" required><br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" required><br><br>


        <button type="submit">Place Order</button>
      </form>
    </div>
  </div>

  <footer>
    <p>© 2025 Farm of Bihar. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>

  
</body>
</html>
